name: Reference and source package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Resolve/verify source commits recorded in PLC evidence.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run Python reference and evidence-validator tests (not PLC runtime)
        run: python -m unittest discover -s tests -v
      - name: Check PLC package consistency (not compilation)
        run: python plc/check_package.py
      - name: Run scenario entry points
        run: |
          python -m simulation.run_demo --scenario accept
          python -m simulation.run_demo --scenario reject
          python -m simulation.run_demo --scenario feed-jam
          python -m simulation.run_demo --scenario interlock
      - name: Check a fresh checkout with Windows-style line-ending conversion
        run: |
          git clone --config core.autocrlf=true --no-local . "$RUNNER_TEMP/plc-crlf-check"
          python "$RUNNER_TEMP/plc-crlf-check/plc/check_package.py"
